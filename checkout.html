<body>

    <header>

        <h1>UrbanWear</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="product.html">Shop</a>
        </nav>

    </header>


    <main class="checkout-page">

        <p class="small-heading">CHECKOUT</p>

        <h2>Complete Your Order</h2>


        <div class="checkout-container">

            <!-- Order Summary -->

            <div class="order-summary">

                <h3>Your Order</h3>

                <div id="checkout-product">
                    <!-- JavaScript will display the product here -->
                </div>

            </div>


            <!-- Customer Information -->

            <div class="customer-info">

                <h3>Your Information</h3>

                <form id="checkout-form">

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="John Doe"
                        required
                    >


                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="john@example.com"
                        required
                    >


                    <label for="address">
                        Address
                    </label>

                    <input
                        type="text"
                        id="address"
                        placeholder="123 Main Street"
                        required
                    >


                    <button
                        type="submit"
                        class="button"
                    >
                        Place Order
                    </button>

                </form>

            </div>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
